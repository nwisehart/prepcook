[package]
name = "services"
version = "0.1.44"
edition = "2024"
license = "Apache-2.0"

[features]
default = []
cloud = []
qa-mode = ["executors/qa-mode"]

[dependencies]
indicatif = "0.17"
api-types = { path = "../api-types" }
utils = { path = "../utils" }
git = { path = "../git" }
git-host = { path = "../git-host" }
executors = { path = "../executors" }
db = { path = "../db" }
worktree-manager = { path = "../worktree-manager" }
workspace-manager = { path = "../workspace-manager" }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
serde = { workspace = true }
serde_json = { workspace = true }
url = "2.5"
anyhow = { workspace = true }
tracing = { workspace = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "sqlite-preupdate-hook", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
ts-rs = { workspace = true }
dirs = "5.0"
async-trait = { workspace = true }
rust-embed = "8.2"
ignore = "0.4"
notify-rust = "4.11"
os_info = "3.12.0"
reqwest = { workspace = true }
json-patch = "2.0"
base64 = "0.22"
backon = "1.5.1"
thiserror = { workspace = true }
futures = "0.3.31"
tokio-stream = "0.1.17"
strum = "0.27.2"
strum_macros = "0.27.2"
notify = "8.2.0"
notify-debouncer-full = "0.5.0"
dunce = "1.0"
dashmap = "6.1"
once_cell = "1.20"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
enum_dispatch = "0.3.13"
fst = "0.4"
moka = { version = "0.12", features = ["future"] }
mime_guess = "2.0"
toml = "0.8"
command-group = { version = "5.0", features = ["with-tokio"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
