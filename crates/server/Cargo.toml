[package]
name = "server"
# Keep in lockstep with package.json: the in-app version badge renders this
# crate's CARGO_PKG_VERSION, and `prepcook up` pulls the board image of this
# version (the release workflow checks both against the tag).
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
default-run = "prepcook"

[[bin]]
name = "prepcook"
path = "src/main.rs"

[lints.clippy]
uninlined-format-args = "allow"

[dependencies]
api-types = { path = "../api-types" }
deployment = { path = "../deployment" }
executors = { path = "../executors" }
local-deployment = { path = "../local-deployment" }
utils = { path = "../utils" }
git = { path = "../git" }
git-host = { path = "../git-host" }
db = { path = "../db" }
services = { path = "../services" }
worktree-manager = { path = "../worktree-manager" }
workspace-manager = { path = "../workspace-manager" }
ws-bridge = { path = "../ws-bridge" }
preview-proxy = { path = "../preview-proxy" }
tokio = { workspace = true }
shlex = "1.3.0"
tokio-util = { version = "0.7", features = ["io"] }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "sqlite-preupdate-hook", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
ts-rs = { workspace = true }
tower-http = { workspace = true }
schemars = { workspace = true }
sentry = { version = "0.46.2", default-features = false, features = ["anyhow", "backtrace", "panic", "debug-images", "reqwest", "rustls"] }
reqwest = { workspace = true }
rustls = { workspace = true }
aws-lc-sys = { workspace = true }
aws-lc-rs = { workspace = true }
strip-ansi-escapes = "0.2.1"
thiserror = { workspace = true }
os_info = "3.12.0"
futures-util = "0.3"
http = "1"
base64 = "0.22"
mime_guess = "2.0"
rust-embed = "8.2"
url = "2.5"
rand = { version = "0.8", features = ["std"] }
sha2 = "0.10"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }

[build-dependencies]
dotenv = "0.15"

[dev-dependencies]
tempfile = "3"

[features]
default = []
qa-mode = ["services/qa-mode", "executors/qa-mode"]
