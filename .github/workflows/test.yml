name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Both Rust workspaces build from the committed .sqlx query data; no
  # database is needed.
  SQLX_OFFLINE: 'true'

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: rust

      - name: Workspace (fmt, clippy, tests)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Board service, crates/remote (fmt, clippy, tests)
        run: |
          cargo fmt --all --manifest-path crates/remote/Cargo.toml -- --check
          cargo clippy --manifest-path crates/remote/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path crates/remote/Cargo.toml

  licenses:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        manifest-path:
          - Cargo.toml
          - crates/remote/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Policy lives in deny.toml at the repo root; both workspaces use it.
      - name: Dependency licences
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.manifest-path }}
          command: check licenses

      # Advisories are informational: findings are listed in the step log
      # without failing the job, so licence policy stays the hard gate.
      - name: Security advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        continue-on-error: true
        with:
          manifest-path: ${{ matrix.manifest-path }}
          command: check advisories

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: ./.github/actions/setup-node

      # The generated-types checks build the Rust type generators.
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: frontend

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generated types are current
        run: |
          pnpm run generate-types:check
          pnpm run remote:generate-types:check

      - name: Type checks
        run: |
          pnpm run ui:check
          pnpm run web-core:check
          pnpm run local-web:check

      - name: Lint
        run: |
          pnpm run local-web:lint
          pnpm run ui:lint

      - name: Prettier
        run: |
          pnpm --filter @prepcook/local-web run format:check
          pnpm --filter @prepcook/web-core run format:check
          pnpm --filter @prepcook/ui run format:check

      - name: Unused i18n keys
        run: node scripts/check-unused-i18n-keys.mjs

      - name: Legacy frontend paths
        run: pnpm run local-web:legacy-path-guard

  toolkit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The generated skills must match a fresh generation from this checkout's
      # playbooks, and every substitution rule must still match them.
      - name: Check the generated skills are current
        run: python3 toolkit/generator/generate.py --check

      - name: Run the substitution table tests
        run: python3 -m unittest discover -s toolkit/generator -v

  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the commits a push or pull request adds.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
