# cargo-deny policy for the root workspace and crates/remote.
# cargo-deny finds this file by walking up from the manifest, so both run from
# the repo root:
#   cargo deny check licenses advisories
#   cargo deny --manifest-path crates/remote/Cargo.toml check licenses advisories
#
# Workspace crates declare `license = "Apache-2.0"` (matching LICENSE) so they
# pass the licence check like any other crate.

[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "OpenSSL",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # codex-* crates, pinned to tag rust-v0.124.0
    "https://github.com/openai/codex.git",
    # ts-rs fork carrying TS enum output (branch use-ts-enum)
    "https://github.com/xazukx/ts-rs.git",
]
